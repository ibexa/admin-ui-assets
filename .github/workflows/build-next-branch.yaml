name: Prepare next branch

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prepare-next-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: "ubuntu-26.04"
    steps:
      - name: Generate GitHub App token and configure git
        id: bot
        uses: ibexa/gh-workflows/actions/app-git-identity@main
        with:
          client-id: ${{ secrets.AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_CLIENT_SECRET }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.bot.outputs.token }}

      - name: Run prepare_next.sh
        run: bash bin/prepare_next.sh -v ${{ github.ref_name }} -b ${{ github.ref_name }}

      - name: Push to next branch
        run: git push origin HEAD:${{ github.ref_name }}-next
